name: Update official camera data
on:
  schedule:
    - cron: '10 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: camera-data-publication
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      fixed: ${{ steps.refresh.outputs.fixed }}
      mobile: ${{ steps.refresh.outputs.mobile }}
      nationwide: ${{ steps.refresh.outputs.nationwide }}
      hsinchu: ${{ steps.refresh.outputs.hsinchu }}
    steps:
      - uses: actions/checkout@v6
      - name: Run updater tests
        run: python -m unittest discover -s tests -v
      - id: refresh
        name: Download and validate official data
        shell: bash
        run: |
          set +e
          python scripts/update_fixed.py
          fixed=$?
          python scripts/update_mobile.py
          mobile=$?
          python scripts/update_nationwide.py
          nationwide=$?
          python scripts/update_hsinchu_mobile.py
          hsinchu=$?
          set -e
          echo "fixed=$fixed" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "nationwide=$nationwide" >> "$GITHUB_OUTPUT"
          echo "hsinchu=$hsinchu" >> "$GITHUB_OUTPUT"
          if [ "$fixed" -ne 0 ] && [ "$mobile" -ne 0 ] && [ "$nationwide" -ne 0 ] && [ "$hsinchu" -ne 0 ]; then exit 1; fi
      - name: Save successful snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/locations.js data/mobile.js data/nationwide.js data/hsinchu-mobile.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official camera data'
            git push
          fi
      - name: Prepare public data files
        run: |
          mkdir -p public/data
          cp data/locations.js data/mobile.js data/nationwide.js data/hsinchu-mobile.js public/data/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v5
  report-partial-failure:
    if: ${{ always() && needs.update.result == 'success' && (needs.update.outputs.fixed != '0' || needs.update.outputs.mobile != '0' || needs.update.outputs.nationwide != '0' || needs.update.outputs.hsinchu != '0') }}
    needs: [update, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report failed data sources
        env:
          FIXED_STATUS: ${{ needs.update.outputs.fixed }}
          MOBILE_STATUS: ${{ needs.update.outputs.mobile }}
          NATIONWIDE_STATUS: ${{ needs.update.outputs.nationwide }}
          HSINCHU_STATUS: ${{ needs.update.outputs.hsinchu }}
        run: |
          [ "$FIXED_STATUS" = 0 ] || echo '::error::國道固定式來源更新失敗，保留上次快照。'
          [ "$MOBILE_STATUS" = 0 ] || echo '::error::臺中移動式來源更新失敗，保留上次快照。'
          [ "$NATIONWIDE_STATUS" = 0 ] || echo '::error::全國測速來源更新失敗，保留上次快照。'
          [ "$HSINCHU_STATUS" = 0 ] || echo '::error::新竹移動式來源更新失敗，保留上次快照。'
          exit 1
